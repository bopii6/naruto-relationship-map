<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>火影忍者 · 人物关系图谱</title>
<!--
  ============================================================================
  设计系统
  ----------------------------------------------------------------------------
  底色     : 墨黑 #0a0a0c
  点缀色   : 朱印红 #c8402f
  阵营色   : 木叶 #57c785 / 宇智波 #a277e8 / 晓 #ef5b52 / 砂隐 #d9a441 / 千手 #56a8e8
  关系色   : 血亲 #f472b6 / 师徒 #d9a441 / 同班 #4f8ff7 / 羁绊 #2fbf9b / 宿敌 #7c828d / 操控 #e0574f
  字号阶梯 : 24 / 17 / 14 / 12.5 / 11.5 / 10.5
  三种视图 : 聚焦（点谁只看谁）/ 分区（按阵营分块）/ 分层（按世代分栏）
  节点     : 圆形头像（内嵌 base64，离线可用）+ 阵营色光环 + 名字定字号显示在下方
  布局     : 完全确定性，无物理模拟；位置做插值补间，切换视图时平滑过渡
  依赖     : 无
  ============================================================================
-->
<style>
  :root{
    --ink:#0a0a0c;
    --panel:rgba(19,19,22,.76);
    --line:rgba(255,255,255,.075);
    --txt:#e8e6e3;
    --muted:#8b8b93;
    --seal:#c8402f;
    --sans:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","STZhongsong","SimSun",serif;
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(ellipse 130% 95% at 50% 38%,#15130f 0%,#0c0b09 52%,#070706 100%);
    color:var(--txt);font-family:var(--sans);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  /* 和纸纤维 + 云母暖斑 + 三方光晕 */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(232,220,200,.020) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(232,220,200,.015) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(38deg, rgba(232,220,200,.010) 0 2px, transparent 2px 9px),
      radial-gradient(ellipse 40% 36% at 14% 6%, rgba(214,166,96,.055), transparent 70%),
      radial-gradient(ellipse 38% 34% at 88% 94%, rgba(214,166,96,.040), transparent 70%),
      radial-gradient(ellipse 62% 55% at 50% 44%, rgba(110,128,158,.09), transparent 72%),
      radial-gradient(ellipse 46% 42% at 6% 96%, rgba(200,64,47,.070), transparent 72%),
      radial-gradient(ellipse 46% 42% at 96% 4%, rgba(162,119,232,.055), transparent 72%);
  }
  #stage{position:fixed;inset:0;z-index:1;display:block;touch-action:none}

  .hud{
    position:fixed;z-index:5;
    background:var(--panel);
    background-image:repeating-linear-gradient(45deg, rgba(232,220,200,.016) 0 1px, transparent 1px 4px);
    border:1px solid var(--line);
    border-radius:14px;
    backdrop-filter:blur(14px) saturate(130%);
    -webkit-backdrop-filter:blur(14px) saturate(130%);
    box-shadow:0 20px 48px rgba(0,0,0,.55);
  }

  /* 族徽 */
  .crest{display:block;flex:0 0 auto;overflow:visible}
  .chip .crest{opacity:.92}
  .d-fac .crest{opacity:.95}

  /* ── 顶栏 ── */
  .hud-top{top:18px;left:18px;right:18px;display:flex;align-items:center;gap:18px;padding:10px 16px}
  .brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
  .seal{
    width:38px;height:38px;flex:0 0 auto;border-radius:5px;
    background:linear-gradient(158deg,#cf4534,#8a2116);
    color:#fff3e4;display:grid;place-items:center;
    font-family:var(--serif);font-size:21px;font-weight:700;line-height:1;
    box-shadow:0 5px 16px rgba(200,64,47,.36),
      inset 0 0 0 1.5px rgba(255,240,220,.34),
      inset 0 2px 0 rgba(255,255,255,.16);
  }
  .brand h1{margin:0;font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
  .brand .sub{margin:2px 0 0;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  .tabs{display:flex;gap:3px;padding:3px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--line);flex:0 0 auto}
  .tabs button{
    padding:7px 15px;border:0;border-radius:8px;background:transparent;color:#9d9ca4;
    font-family:var(--sans);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;
    transition:all 160ms var(--ease);
  }
  .tabs button:hover{color:#e8e6e3;background:rgba(255,255,255,.05)}
  .tabs button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
  #lensTabs button{letter-spacing:.04em}
  #lensTabs button[data-lens="emotion"][aria-selected="true"]{
    background:rgba(224,72,58,.22);color:#ffd8d1;box-shadow:inset 0 0 0 1px rgba(224,72,58,.55);
  }

  .spacer{flex:1 1 auto;min-width:0}
  .search-wrap{position:relative;flex:0 1 236px;min-width:130px}
  #search{
    width:100%;height:34px;padding:0 32px 0 11px;background:rgba(255,255,255,.045);color:var(--txt);
    border:1px solid var(--line);border-radius:9px;font-family:var(--sans);font-size:12.5px;outline:none;
    transition:border-color 160ms var(--ease),background 160ms var(--ease);
  }
  #search::placeholder{color:#6a6a72}
  #search:focus{border-color:rgba(200,64,47,.6);background:rgba(255,255,255,.07)}
  .search-wrap::after{content:"⌕";position:absolute;right:11px;top:50%;transform:translateY(-52%);font-size:15px;color:#6a6a72;pointer-events:none}
  .suggest{
    position:absolute;top:calc(100% + 8px);left:0;right:0;background:rgba(16,16,19,.97);
    border:1px solid var(--line);border-radius:11px;padding:5px;display:none;max-height:320px;overflow:auto;
    box-shadow:0 22px 46px rgba(0,0,0,.6);
  }
  .suggest.open{display:block}
  .suggest button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 9px;
    border:0;border-radius:9px;cursor:pointer;background:transparent;color:var(--txt);
    font-family:var(--sans);font-size:12.5px;transition:background 160ms var(--ease);
  }
  .suggest button:hover,.suggest button[data-active="1"]{background:rgba(255,255,255,.07)}
  .suggest .s-ttl{margin-left:auto;font-size:10px;color:var(--muted);white-space:nowrap}
  .suggest .none{padding:10px;font-size:12px;color:var(--muted)}
  .s-av{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:50% 50%;flex:0 0 auto;background:#1a1a1e}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

  /* ── 侧栏 ── */
  .hud-left{top:100px;left:18px;width:206px;padding:15px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 186px);overflow:auto}
  .hud-left h2{margin:0 0 8px;font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;cursor:pointer;user-select:none;
    border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.028);font-size:11.5px;color:#b9b8bf;
    line-height:1.35;white-space:nowrap;transition:all 160ms var(--ease);
  }
  .chip:hover{border-color:rgba(255,255,255,.26);color:#e8e6e3}
  .chip[aria-pressed="false"]{opacity:.32}
  .chip .bar{width:12px;height:2px;border-radius:2px;flex:0 0 auto}
  .btns{display:flex;flex-wrap:wrap;gap:5px}
  .btns button{
    flex:1 1 auto;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);color:#c9c8cf;font-family:var(--sans);font-size:11.5px;
    transition:all 160ms var(--ease);
  }
  .btns button:hover{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.24)}
  .hint{font-size:10.5px;line-height:1.75;color:#6a6a72;border-top:1px solid var(--line);padding-top:11px}
  .hint b{color:#9d9ca4;font-weight:500}

  /* ── 详情面板 ── */
  .hud-right{top:100px;right:18px;width:300px;padding:17px;max-height:calc(100vh - 186px);overflow:auto}
  .empty{text-align:center;padding:20px 4px 6px}
  .empty-seal{
    width:48px;height:48px;margin:0 auto 15px;border-radius:12px;display:grid;place-items:center;
    font-family:var(--serif);font-size:23px;color:#d0503d;border:1px solid rgba(200,64,47,.45);background:rgba(200,64,47,.08);
  }
  .empty-t{margin:0 0 6px;font-size:13.5px;color:#d5d3d0}
  .empty-d{margin:0;font-size:11.5px;line-height:1.8;color:var(--muted)}
  .empty-stats{display:flex;gap:26px;justify-content:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
  .empty-stats div{display:flex;flex-direction:column;gap:2px}
  .empty-stats b{font-family:var(--serif);font-size:23px;font-weight:600;color:#e8e6e3}
  .empty-stats span{font-size:9.5px;letter-spacing:.16em;color:var(--muted)}

  .d-head{display:flex;align-items:flex-start;gap:13px;padding-bottom:13px;border-bottom:1px solid var(--line)}
  .d-orb{
    width:60px;height:60px;flex:0 0 auto;border-radius:50%;overflow:hidden;position:relative;
    border:2px solid #666;background:#111114;
  }
  .d-orb img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
  .d-orb .d-orb-fallback{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:600}
  .d-name{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.03em;line-height:1.25}
  .d-title{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
  .d-ep{
    margin:8px 0 0;display:flex;align-items:center;gap:8px;
    font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.32em;color:#e9dcc2;
    text-shadow:0 0 14px rgba(200,64,47,.18);
  }
  .d-ep::before{content:"";flex:0 0 auto;width:3px;height:15px;border-radius:2px;background:var(--seal);box-shadow:0 0 9px rgba(200,64,47,.55)}
  .d-fac{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:3px 9px;border-radius:999px;font-size:10.5px;border:1px solid currentColor}
  .d-note{margin:13px 0 0;font-size:12px;line-height:1.85;color:#b6b4bb;text-wrap:pretty}
  .d-sec{margin-top:18px}
  .d-sec h3,.d-qsec h3{margin:0 0 7px;font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
  .d-sec h3 .bar,.d-qsec h3 .bar{width:13px;height:2px;border-radius:2px}
  .rel{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;margin-bottom:1px;
    border:0;border-radius:9px;cursor:pointer;background:transparent;color:var(--txt);
    font-family:var(--sans);transition:background 160ms var(--ease);
  }
  .rel:hover{background:rgba(255,255,255,.07)}
  .rel .bar{height:2px;border-radius:2px;flex:0 0 auto;width:13px}
  .rel .r-av{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:50% 50%;flex:0 0 auto;background:#1a1a1e}
  .rel-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
  .rel-l1{display:flex;align-items:center;gap:7px;min-width:0}
  .rel .rl{font-size:10.5px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
  .rel .rn{font-size:12.5px;color:#e8e6e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rel-l2{font-size:10.5px;color:#70707a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rel .go{margin-left:auto;font-size:11px;color:#5c5c64;flex:0 0 auto}
  .heat-num{flex:0 0 auto;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.85}

  /* ── 情感内核 ── */
  .d-drive{margin-top:14px;padding:10px 11px;border:1px solid;border-radius:11px}
  .d-drive-h{display:flex;align-items:center;gap:7px}
  .d-drive-h b{font-size:13px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
  .d-drive-line{flex:1 1 auto;min-width:0;font-size:10.5px;color:#8b8b93;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .d-drive-h em{font-style:normal;font-size:11px;font-weight:600;color:#b9b8bf;font-variant-numeric:tabular-nums}
  .d-heat{margin-top:8px;height:3px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
  .d-heat i{display:block;height:100%;border-radius:3px}
  .d-quote{
    margin:13px 0 0;padding:2px 0 2px 11px;border-left:2px solid rgba(200,64,47,.55);
    font-family:var(--serif);font-size:13.5px;line-height:1.75;color:#e2dfdb;text-wrap:pretty;
  }
  .d-why{margin:11px 0 0;font-size:11.5px;line-height:1.85;color:#9c9aa2;text-wrap:pretty}

  /* ── 驱动力分组（侧栏） ── */
  .h2-tip{font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;color:#5c5c64;font-size:9px;margin-left:5px}
  .drives{display:flex;flex-direction:column;gap:1px}
  .drv{
    display:flex;flex-direction:column;gap:4px;width:100%;padding:6px 8px;border:0;border-radius:9px;
    background:transparent;cursor:pointer;text-align:left;font-family:var(--sans);
    transition:background 160ms var(--ease),opacity 160ms var(--ease);
  }
  .drv:hover{background:rgba(255,255,255,.07)}
  .drv[aria-pressed="false"]{opacity:.32}
  .drv-t{display:flex;align-items:center;gap:7px}
  .drv-t b{flex:1 1 auto;font-size:11.5px;font-weight:500;color:#d5d3d0}
  .drv-t i{font-style:normal;font-size:10px;color:#7d7d85;font-variant-numeric:tabular-nums}
  .drv-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
  .drv-bar i{display:block;height:100%;border-radius:3px;transition:width 220ms var(--ease)}
  .d-acts{display:flex;gap:6px;margin-top:16px}
  .d-acts button{
    flex:1;padding:8px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:transparent;
    color:var(--muted);font-family:var(--sans);font-size:11.5px;transition:all 160ms var(--ease);
  }
  .d-acts button:hover{background:rgba(255,255,255,.06);color:#e8e6e3}

  /* ── 名言 · 名场面 ── */
  .d-qsec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  figure.q{
    margin:9px 0 0;padding:9px 11px 10px;border-radius:10px;
    background:rgba(255,255,255,.032);border:1px solid var(--line);
    border-left:2px solid var(--qc,#6a6a72);
  }
  .q-t{margin:0;font-family:var(--serif);font-size:12.5px;line-height:1.82;color:#eae7e3;text-wrap:pretty}
  .q-t::before{content:"「";color:var(--qc,#8b8b93);opacity:.75}
  .q-t::after{content:"」";color:var(--qc,#8b8b93);opacity:.75}
  .q-s{margin:9px 0 0;display:flex;align-items:center;gap:7px;font-size:10.5px;color:#8b8b93;line-height:1.5}
  .q-chip{
    flex:0 0 auto;padding:1px 6px;border-radius:5px;font-size:9.5px;letter-spacing:.06em;
    color:var(--qc,#b9b8bf);background:color-mix(in srgb,var(--qc,#888) 16%,transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--qc,#888) 40%,transparent);
  }
  .q-where{flex:1 1 auto;min-width:0}
  .q-d{margin:6px 0 0;font-size:10.5px;line-height:1.8;color:#7f7d85;text-wrap:pretty}

  /* ── 名言总览（全屏） ── */
  .qov{position:fixed;inset:0;z-index:20;display:none;background:rgba(6,6,8,.8);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
  .qov.on{display:block}
  .qov-panel{
    position:absolute;top:26px;bottom:26px;left:50%;transform:translateX(-50%);width:min(1160px,calc(100vw - 48px));
    display:flex;flex-direction:column;overflow:hidden;border-radius:18px;
    background:rgba(16,16,19,.94);border:1px solid var(--line);box-shadow:0 32px 84px rgba(0,0,0,.72);
  }
  .qov-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .qov-title{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
  .qov-title b{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.06em}
  .qov-title span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .qov-search{flex:1 1 auto;min-width:90px}
  .qov-search input{
    width:100%;height:34px;padding:0 12px;background:rgba(255,255,255,.05);color:var(--txt);
    border:1px solid var(--line);border-radius:9px;font-family:var(--sans);font-size:12.5px;outline:none;
  }
  .qov-search input:focus{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.08)}
  .qov-btn{
    flex:0 0 auto;height:34px;padding:0 14px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.045);color:#c9c8cf;
    font-family:var(--sans);font-size:12.5px;transition:all 160ms var(--ease);
  }
  .qov-btn:hover{background:rgba(255,255,255,.1);color:#fff}
  .qov-btn.acc{border-color:rgba(200,64,47,.5);background:rgba(200,64,47,.16);color:#ffd6cd}
  .qov-themes{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:11px 18px;border-bottom:1px solid var(--line)}
  .qov-themes .chip{font-size:11.5px;padding:5px 10px}
  .qov-body{flex:1 1 auto;overflow-y:auto;padding:16px 18px 26px}
  .qov-body::-webkit-scrollbar{width:9px}
  .qov-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}
  .qov-group{margin:0 0 22px}
  .qov-group > h4{
    margin:0 0 10px;display:flex;align-items:center;gap:8px;
    font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#6c6c74;
  }
  .qov-group > h4::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
  .qov-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(322px,1fr));gap:12px;align-items:start}
  .qov-card{
    margin:0;padding:13px 15px 14px;border-radius:12px;
    background:rgba(255,255,255,.035);border:1px solid var(--line);border-left:2px solid var(--qc,#6a6a72);
    cursor:pointer;transition:background 160ms var(--ease),transform 160ms var(--ease);
  }
  .qov-card:hover{background:rgba(255,255,255,.075);transform:translateY(-1px)}
  .qov-who{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .qov-who img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--fc,#555);background:#1a1a1e;flex:0 0 auto}
  .qov-who .nm{font-family:var(--serif);font-size:13.5px;color:#f0eeeb;letter-spacing:.03em}
  .qov-who .who-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
  .qov-who .ep{font-family:var(--serif);font-size:11px;font-weight:600;letter-spacing:.22em;color:#d9c99f}
  .qov-who .tt{font-size:10px;color:#7d7d85;margin-left:auto;font-variant-numeric:tabular-nums}
  .qov-quote{margin:0;font-family:var(--serif);font-size:14px;line-height:1.85;color:#eae7e3;text-wrap:pretty}
  .qov-quote::before{content:"「";color:var(--qc,#8b8b93);opacity:.7}
  .qov-quote::after{content:"」";color:var(--qc,#8b8b93);opacity:.7}
  .qov-where{margin:9px 0 0;display:flex;align-items:flex-start;gap:7px;font-size:10.5px;color:#8b8b93;line-height:1.6}
  .qov-d{margin:7px 0 0;font-size:11px;line-height:1.8;color:#7f7d85;text-wrap:pretty}
  .qov-scene{
    flex:0 0 auto;padding:1px 6px;border-radius:5px;font-size:9.5px;letter-spacing:.08em;
    color:#9b9aa2;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line);
  }
  .qov-pick .qov-card{background:rgba(200,64,47,.07);border-color:rgba(200,64,47,.28)}
  .qov-empty{padding:60px 0;text-align:center;color:var(--muted);font-size:12.5px}

  .hud-bottom{
    bottom:18px;left:50%;transform:translateX(-50%);padding:7px 16px;display:flex;align-items:center;gap:12px;
    font-size:11px;color:var(--muted);white-space:nowrap;
  }
  .hud-bottom b{color:#b9b8bf;font-weight:500}
  .hud-bottom kbd{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--sans);font-size:10px;color:#b9b8bf}

  #tip{
    position:fixed;z-index:9;pointer-events:none;padding:8px 11px;border-radius:10px;max-width:290px;
    background:rgba(11,11,13,.95);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.65);
    opacity:0;transition:opacity 110ms linear;
  }
  #tip.on{opacity:1}
  #tip .t-row{display:flex;align-items:center;gap:10px}
  #tip .t-av{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 50%;border:2px solid #666;flex:0 0 auto;background:#1a1a1e}
  #tip .t-n{font-family:var(--serif);font-size:14px;font-weight:600;color:#f0eeeb;letter-spacing:.02em;white-space:nowrap}
  #tip .t-ep{margin-top:4px;display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:11.5px;font-weight:600;letter-spacing:.26em;color:#e3d6b8;white-space:nowrap}
  #tip .t-ep::before{content:"";flex:0 0 auto;width:2px;height:11px;border-radius:2px;background:var(--seal)}
  #tip .t-r{margin-top:3px;font-size:10.5px;color:#8b8b93;line-height:1.5;white-space:nowrap}
  #tip .t-d{margin-top:5px;display:flex;align-items:center;gap:6px;font-size:10.5px;color:#8b8b93;white-space:nowrap}
  #tip .t-d i{font-style:normal;color:#63636b;margin-left:2px}

  #navToggle{display:none}

  @media (max-width:1180px){ .hud-right{width:262px} .brand .sub{display:none} }
  @media (max-width:960px){
    .hud-left{
      top:auto;bottom:62px;left:18px;right:18px;width:auto;max-height:42vh;
      transform:translateY(calc(100% + 90px));opacity:0;pointer-events:none;
      transition:transform 220ms var(--ease),opacity 220ms var(--ease);
    }
    .hud-left.open{transform:none;opacity:1;pointer-events:auto}
    #navToggle{
      display:inline-flex;align-items:center;padding:0 12px;height:34px;border-radius:9px;cursor:pointer;
      border:1px solid var(--line);background:rgba(255,255,255,.045);color:#c9c8cf;
      font-family:var(--sans);font-size:12.5px;flex:0 0 auto;
    }
    .hud-right{top:auto;bottom:62px;left:18px;right:18px;width:auto;max-height:38vh}
    .hud-bottom{display:none}
    .tabs button{padding:7px 11px;font-size:12px}
  }
  @media (max-width:700px){
    .brand h1{font-size:13px}
    .brand .sub{display:none}
    .seal{width:32px;height:32px;font-size:17px}
    .hud-top{gap:10px;padding:9px 11px}
    .search-wrap{flex:1 1 60px;min-width:0}
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<header class="hud hud-top">
  <div class="brand">
    <div class="seal">火</div>
    <div>
      <h1>火影忍者 · 人物关系图谱</h1>
      <p class="sub">Naruto — Relationship Map</p>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" data-mode="focus" aria-selected="false">聚焦 · 点谁看谁</button>
    <button type="button" role="tab" data-mode="zone"  aria-selected="true">分区 · 按阵营</button>
    <button type="button" role="tab" data-mode="gen"   aria-selected="false">分层 · 按世代</button>
  </div>
  <div class="tabs lens" id="lensTabs" role="tablist" aria-label="视角">
    <button type="button" role="tab" data-lens="struct"  aria-selected="true">结构</button>
    <button type="button" role="tab" data-lens="emotion" aria-selected="false">情感</button>
  </div>
  <div class="spacer"></div>
  <button id="navToggle" type="button">筛选</button>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜索角色…" autocomplete="off" spellcheck="false">
    <div id="suggest" class="suggest"></div>
  </div>
</header>

<aside class="hud hud-left" id="leftPanel">
  <section>
    <h2>阵营 / 出身</h2>
    <div class="chips" id="factionList"></div>
  </section>
  <section id="driveSection" style="display:none">
    <h2>情感驱动力 <em class="h2-tip">点＝只看这一种</em></h2>
    <div class="drives" id="driveList"></div>
  </section>
  <section>
    <h2>关系类型</h2>
    <div class="chips" id="typeList"></div>
  </section>
  <section>
    <h2>视图</h2>
    <div class="btns">
      <button id="btnFit" type="button">全览</button>
      <button id="btnBig" type="button">大头像</button>
      <button id="btnLabels" type="button">隐藏名字</button>
    </div>
    <div class="btns" style="margin-top:6px">
      <button id="btnQuotes" type="button">名言 · 名场面</button>
    </div>
  </section>
  <div class="hint">
    <b>点击头像</b> 进入聚焦视图<br>
    <b>悬停</b> 看这一条关系<br>
    <b>滚轮</b> 缩放 · <b>拖空白</b> 平移
  </div>
</aside>

<aside class="hud hud-right" id="detail"></aside>

<div class="hud hud-bottom" id="hintBar"></div>
<div id="tip"></div>

<div id="quoteOverlay" class="qov" aria-hidden="true">
  <div class="qov-panel" role="dialog" aria-modal="true" aria-label="名言 · 名场面">
    <div class="qov-head">
      <div class="qov-title"><b>名言 · 名场面</b><span id="qovCount"></span></div>
      <div class="qov-search">
        <input id="qovInput" type="search" placeholder="搜索台词 / 角色 / 场景…" autocomplete="off" spellcheck="false">
      </div>
      <button id="qovRand" type="button" class="qov-btn acc">随机一句</button>
      <button id="qovClose" type="button" class="qov-btn">关闭</button>
    </div>
    <div class="qov-themes" id="qovThemes"></div>
    <div class="qov-body" id="qovBody"></div>
  </div>
</div>

const _crestCache = new Map();
function crestPath(key) {
  if (_crestCache.has(key)) return _crestCache.get(key);
  const c = CRESTS[key] || {};
  const mk = d => (d && typeof Path2D === 'function') ? new Path2D(d) : null;
  const p = { leaf: mk(c.leaf), line: mk(c.line), glyph: c.glyph || null };
  _crestCache.set(key, p);
  return p;
}

/* Canvas 画族徽：(x,y) 为中心，size＝外接方框边长 */
function drawCrest(key, x, y, size, color, alpha) {
  const c = crestPath(key);
  ctx.save();
  ctx.globalAlpha = alpha;
  if (c.glyph) {
    ctx.fillStyle = color;
    ctx.font = '700 ' + (size * 0.80).toFixed(1) + 'px ' + SERIF;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.glyph, x, y + size * 0.04);
    ctx.restore();
    return;
  }
  const s = size / 24;
  ctx.translate(x - size / 2, y - size / 2);
  ctx.scale(s, s);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.9;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (c.leaf) {
    ctx.stroke(c.leaf);
    if (c.line && size >= 22) ctx.stroke(c.line);
  } else if (c.line) {
    ctx.stroke(c.line);
  }
  ctx.restore();
}

/* HTML 版族徽（侧栏 chip / 详情徽章共用） */
function crestSvg(key, size, color) {
  const c = CRESTS[key] || {};
  const s = size || 14, col = color || 'currentColor';
  if (c.glyph) {
    return '<svg class="crest" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" aria-hidden="true">' +
      '<text x="12" y="12.4" text-anchor="middle" dominant-baseline="central" font-size="17.5" ' +
      'font-weight="700" fill="' + col + '" font-family="serif">' + c.glyph + '</text></svg>';
  }
  return '<svg class="crest" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="' + col + '" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">' +
    (c.leaf ? '<path d="' + c.leaf + '"/>' : '') +
    (c.line ? '<path d="' + c.line + '"/>' : '') +
    '</svg>';
}

/* ══════════════════════════════════════════════════════════════════
   3. 布局
   ══════════════════════════════════════════════════════════════════ */

let CW = 108, CH = 118;
const BPAD = 20, BTITLE = 48, BGAP = 36;
const GPAD = 20, GTITLE = 56, GGAP = 40;

let mode = 'zone';
let focusId = null;
let bigAvatars = false;
let deco = { bounds:null, blocks:[], bands:[], arcs:[] };

const ZONE_DEFS = [
  { key:'konoha',   cols:6, row:0 },
  { key:'uchiha',   cols:3, row:0 },
  { key:'akatsuki', cols:4, row:1 },
  { key:'sand',     cols:3, row:1 },
  { key:'senju',    cols:2, row:1 }
];

function layoutZone() {
  const blocks = [];
  for (const d of ZONE_DEFS) {
    if (!factionOn[d.key]) continue;
    const list = nodes.filter(n => n.f === d.key && n.show).sort((a, b) => b.w - a.w);
    if (!list.length) continue;
    const cols = Math.min(d.cols, list.length);
    const rows = Math.ceil(list.length / cols);
    blocks.push({ key:d.key, list, cols, rows, row:d.row });
  }
  blocks.forEach(b => {
    b.innerW = b.cols * CW; b.innerH = b.rows * CH;
    b.w = b.innerW + BPAD * 2; b.h = b.innerH + BPAD * 2 + BTITLE;
  });

  const rowsMap = {};
  blocks.forEach(b => (rowsMap[b.row] = rowsMap[b.row] || []).push(b));
  const rowIdx = Object.keys(rowsMap).map(Number).sort((a, b) => a - b);
  const rowH = rowIdx.map(r => Math.max.apply(null, rowsMap[r].map(b => b.h)));
  const totalH = rowH.reduce((a, b) => a + b, 0) + BGAP * (rowIdx.length - 1);

  let y = -totalH / 2;
  rowIdx.forEach((r, ri) => {
    const list = rowsMap[r];
    const totalW = list.reduce((a, b) => a + b.w, 0) + BGAP * (list.length - 1);
    let x = -totalW / 2;
    list.forEach(b => { b.x = x; b.y = y + (rowH[ri] - b.h) / 2; x += b.w + BGAP; });
    y += rowH[ri] + BGAP;
  });

  blocks.forEach(b => {
    const gx = b.x + BPAD, gy = b.y + BPAD + BTITLE;
    b.list.forEach((n, i) => {
      const r0 = Math.floor(i / b.cols), c = i % b.cols;
      const inRow = Math.min(b.cols, b.list.length - r0 * b.cols);
      n.tx = gx + (b.cols - inRow) * CW / 2 + c * CW + CW / 2;
      n.ty = gy + r0 * CH + CH / 2;
    });
  });

  return { blocks, arcs:[], bands:[], bounds: boundsOf(blocks) };
}

function layoutGen() {
  const bands = [];
  for (const g of GENS) {
    const list = nodes.filter(n => n.gen === g.id && n.show).sort((a, b) => b.w - a.w);
    if (!list.length) continue;
    const cols = Math.min(g.cols, list.length);
    bands.push({ g, list, cols, rows: Math.ceil(list.length / cols), innerW: cols * CW, innerH: Math.ceil(list.length / cols) * CH });
  }
  bands.forEach(b => { b.w = b.innerW + GPAD * 2; b.h = b.innerH + GPAD * 2 + GTITLE; });

  const maxH = Math.max.apply(null, bands.map(b => b.h));
  const totalW = bands.reduce((a, b) => a + b.w, 0) + GGAP * (bands.length - 1);

  let x = -totalW / 2;
  bands.forEach(b => {
    b.x = x; b.y = -maxH / 2; b.h = maxH;
    const gx = b.x + GPAD;
    const gy = b.y + GPAD + GTITLE + (maxH - GPAD * 2 - GTITLE - b.innerH) / 2;
    b.list.forEach((n, i) => {
      const r0 = Math.floor(i / b.cols), c = i % b.cols;
      const inRow = Math.min(b.cols, b.list.length - r0 * b.cols);
      n.tx = gx + (b.cols - inRow) * CW / 2 + c * CW + CW / 2;
      n.ty = gy + r0 * CH + CH / 2;
    });
    x += b.w + GGAP;
  });

  return { bands, blocks:[], arcs:[], bounds: boundsOf(bands) };
}

function layoutFocus(id) {
  const c = byId.get(id);
  const rel = c.adj.filter(a => a.node.show)
    .map(a => ({ node:a.node, type:a.type, label:a.label }));
  rel.sort((x, y) => REL_ORDER.indexOf(x.type) - REL_ORDER.indexOf(y.type) || y.node.w - x.node.w);

  c.tx = 0; c.ty = 0;
  const n = rel.length;
  /* 环半径按「各头像直径 + 间距」所需的周长反推，保证不挤在一起 */
  const need = rel.reduce((acc, a) => acc + a.node.r * 2 + 72, 0);
  const R = Math.min(640, Math.max(300, need / (Math.PI * 2)));
  const each = (Math.PI * 2) / Math.max(n, 1);
  const start = -Math.PI / 2 - each / 2;

  rel.forEach((a, i) => {
    const ang = start + (i + 0.5) * each;
    a.ang = ang;
    a.node.tx = Math.cos(ang) * R;
    a.node.ty = Math.sin(ang) * R;
  });

  const arcs = [];
  rel.forEach(a => {
    const last = arcs[arcs.length - 1];
    if (last && last.type === a.type) last.items.push(a);
    else arcs.push({ type:a.type, items:[a] });
  });
  arcs.forEach(g => {
    g.a0 = g.items[0].ang - each * 0.5;
    g.a1 = g.items[g.items.length - 1].ang + each * 0.5;
    g.mid = (g.a0 + g.a1) / 2;
  });

  const outer = R + 140;
  return { blocks:[], bands:[], arcs, R, center:c, rel, bounds:{ minX:-outer, minY:-outer, maxX:outer, maxY:outer } };
}

function boundsOf(arr) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  arr.forEach(b => {
    minX = Math.min(minX, b.x); maxX = Math.max(maxX, b.x + b.w);
    minY = Math.min(minY, b.y); maxY = Math.max(maxY, b.y + b.h);
  });
  return { minX, minY, maxX, maxY };
}

function placeAll() {
  nodes.forEach(n => { n.show = !!factionOn[n.f]; n.tx = n.x; n.ty = n.y; });
  let d;
  if (mode === 'focus') {
    if (!focusId || !byId.get(focusId).show) focusId = bestVisibleId();
    if (focusId) {
      d = layoutFocus(focusId);
      /* 只看这一个：非邻居直接移出视野，而不是留在原地变暗 */
      const keep = new Set([focusId]);
      d.rel.forEach(a => keep.add(a.node.id));
      nodes.forEach(n => { if (!keep.has(n.id)) n.show = false; });
    } else {
      d = { blocks:[], bands:[], arcs:[], bounds:null };
    }
  } else if (mode === 'zone') {
    d = layoutZone();
  } else {
    d = layoutGen();
  }
  nodes.forEach(n => {
    if (n.show && !n.wasShown) { n.x = n.tx; n.y = n.ty; }
    n.wasShown = n.show;
  });
  deco = d;
  renderDetail();
  updateHint();
}

function bestVisibleId() {
  const vis = nodes.filter(n => n.show);
  if (!vis.length) return null;
  const deg = n => n.adj.filter(a => a.node.show).length;
  return vis.reduce((a, b) => (deg(b) > deg(a) ? b : a)).id;
}

/* ══════════════════════════════════════════════════════════════════
   4. 画布 / 视图
   ══════════════════════════════════════════════════════════════════ */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let view = { x:0, y:0, k:1 };
let inited = false;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (!inited) { view.x = W / 2; view.y = H / 2; inited = true; }
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function fitView() {
  const b = deco.bounds || { minX:-400, minY:-300, maxX:400, maxY:300 };
  const bw = Math.max(b.maxX - b.minX, 1), bh = Math.max(b.maxY - b.minY, 1);
  const top = 96, bot = 62;
  const availH = Math.max(H - top - bot, 200);

  /* 宽屏时左右面板会盖住画布，取景时把它们的位置让出来 */
  let mx0 = 0, mx1 = 0;
  if (mode !== 'focus' && W > 1180) { mx0 = 226; mx1 = 322; }
  const availW = Math.max(W - mx0 - mx1, 300);

  const padX = bigAvatars ? 0.99 : 0.96;
  const padY = mode === 'focus' ? 0.90 : (bigAvatars ? 0.94 : 0.88);
  view.k = clamp(Math.min((availW * padX) / bw, (availH * padY) / bh), 0.2, 1.9);
  view.x = mx0 + availW / 2 - ((b.minX + b.maxX) / 2) * view.k;
  view.y = top + availH / 2 - ((b.minY + b.maxY) / 2) * view.k;
}

/* ══════════════════════════════════════════════════════════════════
   5. 渲染
   ══════════════════════════════════════════════════════════════════ */

let hoverId = null, selId = null;
let labelsOn = true;
let emotionLens = false;
const factionOn = {}; Object.keys(FACTIONS).forEach(k => factionOn[k] = true);
const typeOn = {};    REL_ORDER.forEach(k => typeOn[k] = true);
const driveOn = {};   DRIVE_ORDER.forEach(k => driveOn[k] = true);

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function qp(a, c, b, t) { const u = 1 - t; return u * u * a + 2 * u * t * c + t * t * b; }

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const k = view.k, ox = view.x, oy = view.y;
  const S = new Map();
  for (const p of nodes) S.set(p.id, [p.x * k + ox, p.y * k + oy]);

  const focus = hoverId || selId || (mode === 'focus' ? focusId : null);
  const nb = new Set();
  if (focus) {
    nb.add(focus);
    for (const l of links) {
      if (l.a.id === focus) nb.add(l.b.id);
      else if (l.b.id === focus) nb.add(l.a.id);
    }
  }

  /* ── 和纸底：木叶漩涡叶徽记水印（跟着世界一起平移） ── */
  {
    let wx, wy, size;
    if (mode === 'focus' && deco.center) {
      wx = deco.center.x; wy = deco.center.y; size = (deco.R || 320) * 1.9;
    } else if (deco.bounds) {
      const b = deco.bounds;
      wx = (b.minX + b.maxX) / 2; wy = (b.minY + b.maxY) / 2;
      size = Math.max(b.maxX - b.minX, b.maxY - b.minY) * 0.62;
    } else { wx = W / 2; wy = H / 2; size = 700; }
    drawCrest('konoha', wx * k + ox, wy * k + oy,
              Math.max(420, Math.min(size, 1500)) * k, '#e8dcc0', 0.075);
  }

  drawDecor(k, ox, oy);

  /* ── 连线 ── */
  ctx.lineCap = 'round';
  const NOW = performance.now();
  for (let li = 0; li < links.length; li++) {
    const l = links[li];
    if (!l.a.show || !l.b.show || !typeOn[l.type]) continue;
    const A = S.get(l.a.id), B = S.get(l.b.id);
    const dx = B[0] - A[0], dy = B[1] - A[1];
    const len = Math.hypot(dx, dy) || 1;
    const cfg = REL[l.type];
    const touched = focus && (l.a.id === focus || l.b.id === focus);
    const same = l.a.f === l.b.f;
    const lensDim = emotionLens && (!driveOn[l.a.drive] || !driveOn[l.b.drive]);

    /* 情感浓度 → 线的粗细与亮度：越烫的关系越粗越亮 */
    const h = (l.heat == null ? 50 : l.heat) / 100;
    const boost = emotionLens ? 1.28 : 1;
    let alpha, lw;
    if (focus) {
      alpha = touched ? (0.42 + h * 0.58) : 0.03;
      lw = touched ? (1.3 + h * 2.7) * boost : 1.0;
    } else {
      alpha = (same ? 0.30 : 0.13) * (0.45 + h * 0.85) * boost;
      lw = (0.7 + h * 2.4) * boost;
    }
    if (lensDim) alpha *= 0.09;
    const bow = Math.min(len * 0.06, 46);
    const cx = (A[0] + B[0]) / 2 + (-dy / len) * bow;
    const cy = (A[1] + B[1]) / 2 + (dx / len) * bow;

    ctx.globalAlpha = Math.min(alpha, 1);
    ctx.strokeStyle = cfg.color;
    ctx.lineWidth = lw;
    ctx.setLineDash(cfg.dash);
    if (touched) { ctx.shadowColor = cfg.color; ctx.shadowBlur = 4 + h * 14; }
    ctx.beginPath();
    ctx.moveTo(A[0], A[1]);
    ctx.quadraticCurveTo(cx, cy, B[0], B[1]);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);

    /* ── 查克拉：一道亮光沿关系线缓慢流动 ── */
    if (alpha > 0.07) {
      const gap = Math.max(11, 30 - h * 16) * k;
      ctx.globalAlpha = Math.min(alpha * 0.85, 0.45);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(lw * 0.42, 0.9);
      ctx.setLineDash([Math.max(2.6 * k, 1.8) + lw * 0.5, gap]);
      ctx.lineDashOffset = -(NOW / 1000) * 34 + li * 17;
      ctx.beginPath();
      ctx.moveTo(A[0], A[1]);
      ctx.quadraticCurveTo(cx, cy, B[0], B[1]);
      ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset = 0;
      ctx.globalAlpha = Math.min(alpha, 1);
    }

    if (l.type === 'control' && (touched || !focus)) {
      const t = 0.9;
      const px = qp(A[0], cx, B[0], t), py = qp(A[1], cy, B[1], t);
      const tx = qp(A[0], cx, B[0], t + 0.02) - px, ty = qp(A[1], cy, B[1], t + 0.02) - py;
      ctx.save(); ctx.translate(px, py); ctx.rotate(Math.atan2(ty, tx));
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-8, -3.8); ctx.lineTo(-8, 3.8);
      ctx.closePath(); ctx.fillStyle = cfg.color; ctx.fill(); ctx.restore();
    }
  }

  /* ── 关系文字 ── */
  if (focus) {
    ctx.font = '500 11px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const l of links) {
      if (!l.a.show || !l.b.show || !typeOn[l.type] || !l.label) continue;
      if (l.a.id !== focus && l.b.id !== focus) continue;
      const A = S.get(l.a.id), B = S.get(l.b.id);
      const dx = B[0] - A[0], dy = B[1] - A[1];
      const len = Math.hypot(dx, dy) || 1;
      const bow = Math.min(len * 0.06, 46) * 0.5;
      const mx = (A[0] + B[0]) / 2 + (-dy / len) * bow;
      const my = (A[1] + B[1]) / 2 + (dx / len) * bow;
      const cfg = REL[l.type];
      const useEmo = emotionLens && l.emo;
      const txt = useEmo ? l.emo : l.label;
      const fs = useEmo ? 10.5 : 11;
      ctx.font = '500 ' + fs + 'px ' + FONT;
      const ph = useEmo ? 19 : 18;
      const w = ctx.measureText(txt).width + 14;
      ctx.globalAlpha = 0.96;
      ctx.fillStyle = 'rgba(10,10,12,.92)';
      roundRect(mx - w / 2, my - ph / 2, w, ph, ph / 2); ctx.fill();
      ctx.strokeStyle = hexA(cfg.color, 0.5); ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#dcdad7';
      ctx.fillText(txt, mx, my + 0.5);
    }
  }

  /* ── 头像节点 ── */
  const pulse = (performance.now() % 2400) / 2400;
  for (const p of nodes) {
    if (!p.show) continue;
    const P = S.get(p.id);
    const x = P[0], y = P[1];
    const fac = FACTIONS[p.f];
    const drv = DRIVES[p.drive] || { color:'#8b8b93', name:'' };
    const isC = mode === 'focus' && focusId === p.id;
    const isF = focus === p.id;
    const lensDim = emotionLens && !driveOn[p.drive];
    const dim = (focus && !nb.has(p.id)) || lensDim;
    const boost = bigAvatars ? 1.22 : 1;
    const r = Math.max(p.r * k * (isC ? 1.26 : 1) * boost, 11);
    const glowCol = emotionLens ? drv.color : fac.color;

    ctx.globalAlpha = dim ? 0.14 : 1;

    if (!dim && focus) {
      const g = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 1.6);
      g.addColorStop(0, hexA(glowCol, 0.32));
      g.addColorStop(1, hexA(glowCol, 0));
      ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, 6.2832);
      ctx.fillStyle = g; ctx.fill();
    }

    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
    ctx.clip();
    ctx.fillStyle = hexA(fac.color, 0.13);
    ctx.fillRect(x - r, y - r, r * 2, r * 2);

    if (p.img && p.img.naturalWidth > 0) {
      const iw = p.img.naturalWidth, ih = p.img.naturalHeight;
      const sc = Math.max((r * 2) / iw, (r * 2) / ih) * 1.04;
      const dw = iw * sc, dh = ih * sc;
      ctx.drawImage(p.img, x - dw / 2, y - dh / 2, dw, dh);
      const vg = ctx.createLinearGradient(0, y + r * 0.25, 0, y + r);
      vg.addColorStop(0, 'rgba(8,8,10,0)');
      vg.addColorStop(1, 'rgba(8,8,10,.30)');
      ctx.fillStyle = vg;
      ctx.fillRect(x - r, y, r * 2, r);
    } else {
      const fs = clamp(r * 0.5, 8.5, 16);
      ctx.font = '600 ' + fs.toFixed(1) + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(p.short, x, y + fs * 0.04);
    }
    ctx.restore();

    /* 阵营色光环（情感镜头下收细，让位给外圈的驱动力环） */
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
    ctx.lineWidth = emotionLens ? 1.6 : ((isC || isF) ? 3 : 2);
    ctx.strokeStyle = dim ? hexA(fac.color, 0.32)
                          : (emotionLens ? hexA(fac.color, 0.8) : fac.color);
    if (!dim && (isC || isF)) { ctx.shadowColor = fac.color; ctx.shadowBlur = 14; }
    ctx.stroke();
    ctx.shadowBlur = 0;

    /* 情感镜头：外面再套一圈「驱动力」色环 */
    if (emotionLens && r >= 12) {
      ctx.beginPath(); ctx.arc(x, y, r + 5.5, 0, 6.2832);
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = dim ? hexA(drv.color, 0.28) : drv.color;
      if (!dim) { ctx.shadowColor = drv.color; ctx.shadowBlur = 11; }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    if (isC) {
      ctx.beginPath(); ctx.arc(x, y, r + 6 + pulse * 16, 0, 6.2832);
      ctx.strokeStyle = hexA(fac.color, (1 - pulse) * 0.55);
      ctx.lineWidth = 1.5; ctx.stroke();
    }

    /* 名字：固定屏幕字号，写在头像下方 */
    if (labelsOn && !dim) {
      const fs = p.w >= 3 ? 12 : 11;
      ctx.font = (p.w >= 3 ? '600 ' : '500 ') + fs + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const avail = CW * k - 6;
      let label = p.name;
      if (ctx.measureText(label).width > avail) label = p.short;
      const ty = y + r + (emotionLens ? 10 : 5);
      ctx.lineWidth = 3.2; ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(6,6,8,.92)';
      ctx.strokeText(label, x, ty);
      ctx.fillStyle = '#eceae7';
      ctx.fillText(label, x, ty);
    }
  }

  ctx.globalAlpha = 1;
}

function drawDecor(k, ox, oy) {
  const T = (x, y) => [x * k + ox, y * k + oy];

  for (const b of deco.blocks) {
    const fac = FACTIONS[b.key];
    const P = T(b.x, b.y);
    const w = b.w * k, h = b.h * k;
    ctx.globalAlpha = 1;
    roundRect(P[0], P[1], w, h, 16 * k);
    ctx.fillStyle = hexA(fac.color, 0.05); ctx.fill();
    ctx.strokeStyle = hexA(fac.color, 0.24); ctx.lineWidth = 1; ctx.stroke();

    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = '600 ' + clamp(14 * k, 10, 19).toFixed(1) + 'px ' + SERIF;
    ctx.fillStyle = fac.color; ctx.globalAlpha = 0.95;
    ctx.fillText(fac.name, P[0] + BPAD * k, P[1] + 15 * k);
    const nw = ctx.measureText(fac.name).width;
    ctx.font = '500 ' + clamp(10.5 * k, 8, 13).toFixed(1) + 'px ' + FONT;
    ctx.fillStyle = '#7d7d85'; ctx.globalAlpha = 0.9;
    ctx.fillText(b.list.length + ' 人', P[0] + BPAD * k + nw + 10, P[1] + 18 * k);

    /* 族徽：区块右上角 */
    drawCrest(b.key, P[0] + w - BPAD * k - 15 * k, P[1] + BTITLE * 0.5 * k,
              clamp(30 * k, 16, 34), fac.color, 0.5);
  }

  for (let i = 0; i < deco.bands.length; i++) {
    const b = deco.bands[i];
    const P = T(b.x, b.y);
    const w = b.w * k, h = b.h * k;
    ctx.globalAlpha = 1;
    roundRect(P[0], P[1], w, h, 16 * k);
    ctx.fillStyle = 'rgba(255,255,255,.022)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.075)'; ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(P[0] + 16 * k, P[1] + 1); ctx.lineTo(P[0] + w - 16 * k, P[1] + 1);
    ctx.strokeStyle = 'rgba(200,64,47,.55)'; ctx.lineWidth = 2; ctx.stroke();

    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = '600 ' + clamp(15 * k, 10.5, 20).toFixed(1) + 'px ' + SERIF;
    ctx.fillStyle = '#e8e6e3';
    ctx.fillText(b.g.main, P[0] + w / 2, P[1] + 14 * k);
    ctx.font = '500 ' + clamp(10.5 * k, 8, 13).toFixed(1) + 'px ' + FONT;
    ctx.fillStyle = '#7d7d85';
    ctx.fillText(b.g.sub, P[0] + w / 2, P[1] + 34 * k);

    /* 每一代都盖上木叶的印 */
    drawCrest('konoha', P[0] + w - 16 * k - 13 * k, P[1] + 24 * k,
              clamp(26 * k, 14, 30), '#e8dcc0', 0.32);

    if (i < deco.bands.length - 1) {
      const nx = T(deco.bands[i + 1].x, b.y);
      const y0 = P[1] + h / 2;
      const x0 = P[0] + w + 8 * k, x1 = nx[0] - 8 * k;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0);
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1, y0); ctx.lineTo(x1 - 6 * k, y0 - 3.5 * k); ctx.lineTo(x1 - 6 * k, y0 + 3.5 * k);
      ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill();
    }
  }

  if (deco.arcs && deco.arcs.length) {
    const C = T(deco.center.x, deco.center.y);
    const Rr = deco.R * k;
    for (const g of deco.arcs) {
      const cfg = REL[g.type];
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(C[0], C[1], Rr + 76 * k, g.a0, g.a1);
      ctx.strokeStyle = hexA(cfg.color, 0.5);
      ctx.lineWidth = Math.max(2, 3 * k);
      ctx.lineCap = 'round'; ctx.stroke();

      const lx = C[0] + Math.cos(g.mid) * (Rr + 104 * k);
      const ly = C[1] + Math.sin(g.mid) * (Rr + 104 * k);
      ctx.font = '600 ' + clamp(12 * k, 9, 16).toFixed(1) + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const tw = ctx.measureText(cfg.name).width;
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(10,10,12,.9)';
      roundRect(lx - tw / 2 - 9, ly - 11, tw + 18, 22, 11); ctx.fill();
      ctx.strokeStyle = hexA(cfg.color, 0.45); ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = cfg.color;
      ctx.fillText(cfg.name, lx, ly + 0.5);
    }
  }
}

/* ══════════════════════════════════════════════════════════════════
   6. 交互
   ══════════════════════════════════════════════════════════════════ */

const tip = document.getElementById('tip');

function pick(mx, my) {
  let best = null, bd = Infinity;
  for (const p of nodes) {
    if (!p.show) continue;
    const x = p.x * view.k + view.x, y = p.y * view.k + view.y;
    const d = Math.hypot(mx - x, my - y);
    const rr = Math.max(p.r * view.k * (bigAvatars ? 1.22 : 1), 16) + 4;
    if (d < rr && d < bd) { bd = d; best = p; }
  }
  return best;
}

let dragNode = null, panning = false;
let lastX = 0, lastY = 0, downX = 0, downY = 0, moved = false;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const p = pick(e.clientX, e.clientY);
  lastX = downX = e.clientX; lastY = downY = e.clientY; moved = false;
  if (p) dragNode = p; else { panning = true; canvas.style.cursor = 'grabbing'; }
});

canvas.addEventListener('pointermove', e => {
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 5) moved = true;

  if (dragNode) {
    dragNode.tx = dragNode.x = (e.clientX - view.x) / view.k;
    dragNode.ty = dragNode.y = (e.clientY - view.y) / view.k;
  } else if (panning) {
    view.x += dx; view.y += dy;
  } else {
    const p = pick(e.clientX, e.clientY);
    const id = p ? p.id : null;
    if (id !== hoverId) {
      hoverId = id;
      canvas.style.cursor = p ? 'pointer' : 'default';
      if (p) showTip(p, e.clientX, e.clientY); else tip.classList.remove('on');
    } else if (p && tip.classList.contains('on')) {
      moveTip(e.clientX, e.clientY);
    }
  }
  lastX = e.clientX; lastY = e.clientY;
});

function endDrag(e) {
  if (dragNode) { if (!moved) selectNode(dragNode.id); dragNode = null; }
  else if (panning) { panning = false; canvas.style.cursor = hoverId ? 'pointer' : 'default'; }
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const nk = clamp(view.k * Math.exp(-e.deltaY * 0.0013), 0.16, 4);
  view.x = e.clientX - (e.clientX - view.x) * (nk / view.k);
  view.y = e.clientY - (e.clientY - view.y) * (nk / view.k);
  view.k = nk;
  hoverId = null; tip.classList.remove('on');
}, { passive:false });

canvas.addEventListener('pointerleave', () => { hoverId = null; tip.classList.remove('on'); });

function showTip(p, mx, my) {
  const fac = FACTIONS[p.f];
  const drv = DRIVES[p.drive] || { name:'', line:'', color:'#888' };
  tip.innerHTML =
    '<div class="t-row">' +
      (p.av ? '<img class="t-av" src="' + p.av + '" style="border-color:' + (emotionLens ? drv.color : fac.color) + '">' : '') +
      '<div><div class="t-n">' + p.name + '</div>' +
      (p.ep ? '<div class="t-ep">' + p.ep + '</div>' : '') +
      '<div class="t-r">' + fac.name + ' · ' + p.title + '</div>' +
      '<div class="t-d"><span class="dot" style="background:' + drv.color + '"></span>' +
        '驱动力 · <b style="color:' + drv.color + '">' + drv.name + '</b>' +
        '<i>' + drv.line + '</i></div>' +
      '</div>' +
    '</div>';
  tip.classList.add('on');
  moveTip(mx, my);
}
function moveTip(mx, my) {
  const r = tip.getBoundingClientRect();
  let x = mx + 18, y = my + 18;
  if (x + r.width > W - 8) x = mx - r.width - 18;
  if (y + r.height > H - 8) y = my - r.height - 18;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}

function setMode(m, id, refit) {
  mode = m;
  if (m === 'focus') { focusId = id || focusId || null; selId = focusId; }
  else focusId = null;
  document.querySelectorAll('#tabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  placeAll();
  if (refit !== false) fitView();
}

function selectNode(id) {
  selId = id;
  tip.classList.remove('on');
  if (mode !== 'focus') setMode('focus', id, true);
  else { focusId = id; placeAll(); fitView(); }
}

function emptyPanel() {

function renderDetail() {
  const id = (mode === 'focus') ? focusId : selId;
  if (!id) { emptyPanel(); return; }
  const p = byId.get(id);
  const fac = FACTIONS[p.f];
  const drv = DRIVES[p.drive] || { name:'', line:'', color:'#8b8b93' };

  const groups = {};
  for (const a of p.adj) {
    if (!a.node.show || !typeOn[a.type]) continue;
    (groups[a.type] = groups[a.type] || []).push(a);
  }

  let relHtml = '';
  for (const key of REL_ORDER) {
    const list = groups[key];
    if (!list || !list.length) continue;
    /* 同一类型里，情感越浓的排越前 */
    list.sort((x, y) => (y.heat || 0) - (x.heat || 0) || y.node.w - x.node.w);
    relHtml +=
      '<div class="d-sec">' +
        '<h3><span class="bar" style="background:' + REL[key].color + '"></span>' +
          REL[key].name + ' · ' + list.length + '</h3>' +
        list.map(a => {
          const ah = a.heat == null ? 50 : a.heat;
          const barW = (4 + ah / 100 * 12).toFixed(0);
          const barA = (0.32 + ah / 100 * 0.68).toFixed(2);
          return '<button class="rel" type="button" data-id="' + a.node.id + '">' +
            (a.node.av ? '<img class="r-av" src="' + a.node.av + '" alt="">' : '') +
            '<span class="rel-txt">' +
              '<span class="rel-l1">' +
                '<span class="bar" style="background:' + REL[key].color +
                  ';width:' + barW + 'px;opacity:' + barA + '"></span>' +
                '<span class="rl">' + a.label + '</span>' +
                '<span class="rn">' + a.node.name + '</span>' +
              '</span>' +
              (a.emo ? '<span class="rel-l2">' + a.emo + '</span>' : '') +
            '</span>' +
            '<span class="go">→</span>' +
          '</button>';
        }).join('') +
      '</div>';
  }

  const inFocus = mode === 'focus';
  detail.innerHTML =
    '<div class="d-head">' + orbHtml(p, 60) +
      '<div>' +
        '<p class="d-name">' + p.name + '</p>' +
        (p.ep ? '<p class="d-ep">' + p.ep + '</p>' : '') +
        '<p class="d-title">' + p.title + '</p>' +
        '<span class="d-fac" style="color:' + fac.color + '">' +
          crestSvg(p.f, 13, fac.color) + fac.name +
        '</span>' +
      '</div>' +
    '</div>' +

    /* 情感内核：驱动力 + 浓度 */
    '<div class="d-drive" style="border-color:' + hexA(drv.color, .38) + ';background:' + hexA(drv.color, .07) + '">' +
      '<div class="d-drive-h">' +
        '<span class="dot" style="background:' + drv.color + '"></span>' +
        '<b style="color:' + drv.color + '">' + drv.name + '</b>' +
        '<span class="d-drive-line">' + drv.line + '</span>' +
        '<em>' + p.heat + '</em>' +
      '</div>' +
      '<div class="d-heat"><i style="width:' + p.heat + '%;background:' + drv.color + '"></i></div>' +
    '</div>' +

    (p.quote ? '<p class="d-quote">' + p.quote + '</p>' : '') +
    (p.why ? '<p class="d-why">' + p.why + '</p>' : '') +
    '<p class="d-note">' + p.note + '</p>' +
    quotesHtml(p.id) +
    relHtml +
    '<div class="d-acts">' +
      (inFocus
        ? '<button type="button" id="dBack">← 返回全景</button>'
        : '<button type="button" id="dFocus">只看 ' + p.short + '</button>') +
      '<button type="button" id="dClear">清除</button>' +
    '</div>';

  detail.querySelectorAll('.rel').forEach(b =>
    b.addEventListener('click', () => selectNode(b.dataset.id)));
  const bk = detail.querySelector('#dBack');
  if (bk) bk.addEventListener('click', () => { selId = null; setMode('zone', null, true); });
  const fc = detail.querySelector('#dFocus');
  if (fc) fc.addEventListener('click', () => selectNode(p.id));
  const cl = detail.querySelector('#dClear');
  if (cl) cl.addEventListener('click', () => {
    selId = null;
    if (mode === 'focus') setMode('zone', null, true); else renderDetail();
  });
}

/* ── 情感驱动力：点一下＝只看这一种，再点＝全部 ── */
const driveListEl = document.getElementById('driveList');
const driveSection = document.getElementById('driveSection');
const driveEls = {};

DRIVE_ORDER.forEach(key => {
  const el = document.createElement('button');
  el.type = 'button'; el.className = 'drv';
  el.setAttribute('aria-pressed', 'true');
  el.title = DRIVES[key].line;
  el.addEventListener('click', () => soloDrive(key));
  driveListEl.appendChild(el);
  driveEls[key] = el;
});

function paintDrives() {
  const count = {};
  DRIVE_ORDER.forEach(k => count[k] = 0);
  nodes.forEach(n => { if (count[n.drive] != null) count[n.drive]++; });
  const max = Math.max.apply(null, DRIVE_ORDER.map(k => count[k])) || 1;
  DRIVE_ORDER.forEach(key => {
    const d = DRIVES[key];
    const el = driveEls[key];
    el.setAttribute('aria-pressed', String(!!driveOn[key]));
    el.innerHTML =
      '<span class="drv-t"><span class="dot" style="background:' + d.color + '"></span>' +
        '<b>' + d.name + '</b><i>' + count[key] + ' 人</i></span>' +
      '<span class="drv-bar"><i style="width:' + (count[key] / max * 100).toFixed(0) +
        '%;background:' + d.color + '"></i></span>';
  });
}

function soloDrive(key) {
  const others = DRIVE_ORDER.filter(k => k !== key);
  const alreadySolo = driveOn[key] && others.every(k => !driveOn[k]);
  DRIVE_ORDER.forEach(k => { driveOn[k] = alreadySolo ? true : (k === key); });
  paintDrives();
}

}

const searchEl = document.getElementById('search');
const suggestEl = document.getElementById('suggest');
let sIdx = -1;

function runSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { suggestEl.classList.remove('open'); return; }
  const hits = nodes
    .map(n => ({ n, s:(n.name.toLowerCase().includes(q) ? 10 : 0) + (n.short.toLowerCase().includes(q) ? 8 : 0) + (n.title.toLowerCase().includes(q) ? 3 : 0) + (n.ep && n.ep.includes(q) ? 6 : 0) }))
    .filter(h => h.s > 0)
    .sort((a, b) => b.s - a.s || b.n.w - a.n.w)
    .slice(0, 7);

  if (!hits.length) {
    suggestEl.innerHTML = '<div class="none">没有找到「' + q + '」</div>';
    suggestEl.classList.add('open'); sIdx = -1; return;
  }
  suggestEl.innerHTML = hits.map(h =>
    '<button type="button" data-id="' + h.n.id + '">' +
      (h.n.av
        ? '<img class="s-av" src="' + h.n.av + '" alt="" style="border:1.5px solid ' + FACTIONS[h.n.f].color + '">'
        : '<span class="dot" style="background:' + FACTIONS[h.n.f].color + '"></span>') +
      h.n.name +
      '<span class="s-ttl">' + (h.n.ep && h.n.ep.includes(q) ? h.n.ep : h.n.title) + '</span>' +
    '</button>').join('');
  suggestEl.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => jump(b.dataset.id)));
  suggestEl.classList.add('open'); sIdx = -1;
}

function jump(id) {
  const n = byId.get(id);
  if (!n) return;
  if (!factionOn[n.f]) {
    factionOn[n.f] = true;
    factionList.children[Object.keys(FACTIONS).indexOf(n.f)].setAttribute('aria-pressed', 'true');
  }
  searchEl.value = ''; suggestEl.classList.remove('open'); searchEl.blur();
  selectNode(id);
}

searchEl.addEventListener('input', e => runSearch(e.target.value));
searchEl.addEventListener('keydown', e => {
  const items = suggestEl.querySelectorAll('button');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    sIdx = (sIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((b, i) => b.dataset.active = i === sIdx ? '1' : '0');
    items[sIdx].scrollIntoView({ block:'nearest' });
  } else if (e.key === 'Enter') {
    if (sIdx >= 0 && items[sIdx]) jump(items[sIdx].dataset.id);
    else if (items[0]) jump(items[0].dataset.id);
  } else if (e.key === 'Escape') {
    suggestEl.classList.remove('open'); searchEl.blur();
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) suggestEl.classList.remove('open');
});

document.addEventListener('keydown', e => {
  if (quoteOv.classList.contains('on')) {
    if (e.key === 'Escape') { e.preventDefault(); closeQuotes(); }
    return;
  }
  if (e.key === 'Escape') {
    if (document.activeElement === searchEl) return;
    selId = null;
    if (mode === 'focus') setMode('zone', null, true); else renderDetail();
  } else if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault(); searchEl.focus();
  } else if (e.key === 'q' && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag !== 'INPUT' && tag !== 'TEXTAREA') { e.preventDefault(); openQuotes(); }
  }
});

/* ══════════════════════════════════════════════════════════════════
   9.5 名言 · 名场面（全屏总览）
   ══════════════════════════════════════════════════════════════════ */

const quoteOv   = document.getElementById('quoteOverlay');
const qovBody   = document.getElementById('qovBody');
const qovInput  = document.getElementById('qovInput');
const qovThemes = document.getElementById('qovThemes');
const qovCount  = document.getElementById('qovCount');

/* 扁平化为「一条 = 一个角色的一句」 */
const ALLQ = [];
nodes.forEach(n => (QUOTES[n.id] || []).forEach(q => ALLQ.push({ n, q })));

const qThemeOn = {};
QTHEMES.forEach(t => { qThemeOn[t.id] = true; });
let qovPick = null;           /* 「随机一句」挑中的那一条 */

QTHEMES.forEach(t => {
  const el = document.createElement('button');
  el.type = 'button'; el.className = 'chip'; el.dataset.theme = t.id;
  el.setAttribute('aria-pressed', 'true');
  el.title = '点一下只看这一种，再点恢复全部';
  el.innerHTML = '<span class="dot" style="background:' + t.color + '"></span>' + t.name;
  el.addEventListener('click', () => {
    const others = QTHEMES.filter(x => x.id !== t.id);
    const solo = qThemeOn[t.id] && others.every(x => !qThemeOn[x.id]);
    QTHEMES.forEach(x => { qThemeOn[x.id] = solo ? true : (x.id === t.id); });
    qovPick = null; paintQThemes(); renderQuotes();
  });
  qovThemes.appendChild(el);
});

function paintQThemes() {
  for (const el of qovThemes.children) {
    el.setAttribute('aria-pressed', String(!!qThemeOn[el.dataset.theme]));
  }
}
paintQThemes();

function qovCardHtml(it, themeColor) {
  const fac = FACTIONS[it.n.f];
  return '<article class="qov-card" data-id="' + it.n.id +
      '" style="--qc:' + themeColor + ';--fc:' + fac.color + '">' +
    '<div class="qov-who">' +
      (it.n.av ? '<img src="' + it.n.av + '" alt="">' : '') +
      '<span class="who-txt">' +
        '<span class="nm">' + it.n.name + '</span>' +
        (it.n.ep ? '<span class="ep">' + it.n.ep + '</span>' : '') +
      '</span>' +
      '<span class="tt">' + it.n.title + '</span>' +
    '</div>' +
    '<p class="qov-quote">' + it.q.q + '</p>' +
    '<p class="qov-where"><span class="qov-scene">场景</span><span>' + it.q.s + '</span></p>' +
    (it.q.d ? '<p class="qov-d">' + it.q.d + '</p>' : '') +
  '</article>';
}

function qovGroupHtml(title, color, rows) {
  return '<section class="qov-group' + (title === '随机一句' ? ' qov-pick' : '') + '">' +
    '<h4><span class="dot" style="background:' + color + '"></span>' + title +
      ' · ' + rows.length + '</h4>' +
    '<div class="qov-cards">' +
      rows.map(it => qovCardHtml(it, color)).join('') +
    '</div></section>';
}

function renderQuotes() {
  const text = qovInput.value.trim().toLowerCase();
  const rows = ALLQ.filter(it =>
    qThemeOn[it.q.t] && (!text ||
      it.q.q.toLowerCase().includes(text) ||
      it.q.s.toLowerCase().includes(text) ||
      (it.q.d || '').toLowerCase().includes(text) ||
      it.n.name.toLowerCase().includes(text) ||
      it.n.short.toLowerCase().includes(text) ||
      (it.n.ep || '').includes(text)));

  qovCount.textContent = rows.length + ' / ' + ALLQ.length + ' 条 · ' + nodes.length + ' 个角色';

  const pick = qovPick && qThemeOn[qovPick.q.t] && (!text ||
    qovPick.q.q.toLowerCase().includes(text) ||
    qovPick.n.name.toLowerCase().includes(text)) ? qovPick : null;

  let html = pick ? qovGroupHtml('随机一句', '#c8402f', [pick]) : '';
  QTHEMES.forEach(t => {
    const g = rows.filter(it => it.q.t === t.id);
    if (g.length) html += qovGroupHtml(t.name, t.color, g);
  });

  if (!pick && !html) {
    qovBody.innerHTML = '<div class="qov-empty">没有找到符合条件的名言</div>';
    return;
  }
  qovBody.innerHTML = html;
  qovBody.querySelectorAll('.qov-card').forEach(c =>
    c.addEventListener('click', () => { closeQuotes(); jump(c.dataset.id); }));
}

function openQuotes() {
  quoteOv.classList.add('on');
  quoteOv.setAttribute('aria-hidden', 'false');
  renderQuotes();
  qovInput.focus();
}

function closeQuotes() {
  quoteOv.classList.remove('on');
  quoteOv.setAttribute('aria-hidden', 'true');
  qovPick = null;
  qovInput.value = '';
}

function toggleQuotes() {
  quoteOv.classList.contains('on') ? closeQuotes() : openQuotes();
}

document.getElementById('btnQuotes').addEventListener('click', openQuotes);
document.getElementById('qovClose').addEventListener('click', closeQuotes);
document.getElementById('qovRand').addEventListener('click', () => {
  const pool = ALLQ.filter(it => qThemeOn[it.q.t]);
  if (!pool.length) return;
  let next = pool[Math.floor(Math.random() * pool.length)];
  if (pool.length > 1 && qovPick) {
    for (let i = 0; i < 8 && next === qovPick; i++) next = pool[Math.floor(Math.random() * pool.length)];
  }
  qovPick = next;
  qovInput.value = '';
  if (!quoteOv.classList.contains('on')) { quoteOv.classList.add('on'); quoteOv.setAttribute('aria-hidden', 'false'); }
  renderQuotes();
  qovBody.scrollTop = 0;
});
let qovTimer = 0;
qovInput.addEventListener('input', () => {
  clearTimeout(qovTimer);
  qovTimer = setTimeout(() => { qovPick = null; renderQuotes(); }, 120);
});
quoteOv.addEventListener('click', e => { if (e.target === quoteOv) closeQuotes(); });

/* ══════════════════════════════════════════════════════════════════
   10. 启动
   ══════════════════════════════════════════════════════════════════ */

resize();
window.addEventListener('resize', () => { resize(); fitView(); });

placeAll();
fitView();

function loop() {
  for (const p of nodes) {
    if (p === dragNode) continue;
    p.x += (p.tx - p.x) * 0.17;
    p.y += (p.ty - p.y) * 0.17;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
